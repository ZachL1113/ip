name: Complete final iP increments and release

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/complete-final-ip.yml'

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test fat JAR
        run: |
          chmod +x gradlew
          ./gradlew clean test shadowJar
          test "$(stat -c%s build/libs/nova.jar)" -gt 5000000
          unzip -p build/libs/nova.jar META-INF/MANIFEST.MF | grep -q 'Main-Class: nova.Launcher'

      - name: Create lightweight increment tags
        run: |
          git tag A-BetterGui 8a04ba95c38bc421eb5dcf38a6ce38d9f6643fd0
          git tag A-MoreErrorHandling f7e3db27be5a4efaea905ceb28cf3f980bdb6b2a
          git tag A-MoreTesting 988aa3d87b88d505d6187da0a206e8f8bfee4264
          git push origin A-BetterGui A-MoreErrorHandling A-MoreTesting

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2 build/libs/nova.jar --target master --title 'Nova v0.2' --notes 'Final CS2103T iP release with improved GUI feedback, stronger error handling, and expanded automated tests.'
